[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-scribe"
version = "0.1.0"
description = "Local-first multilingual clinical documentation assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "GitPython>=3.1,<4.0",
  "pydantic>=2.7,<3.0",
  "python-docx>=1.1,<2.0",
  "PyYAML>=6.0,<7.0",
  "reportlab>=4.2,<5.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
transcription = [
  "faster-whisper>=1.1,<2.0",
  "numpy>=1.26,<3.0",
]
translation = [
  "transformers>=4.45,<5.0",
  "torch>=2.4,<3.0",
  "sentencepiece>=0.2,<1.0",
]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "config*", "core*", "models*", "storage*", "worker*"]

[tool.setuptools.package-data]
api = ["static/*"]
config = ["*.yaml", "examination_mappings/*.yaml"]

[tool.setuptools.data-files]
templates = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
