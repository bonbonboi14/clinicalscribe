<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Clinical Scribe — Phone Recording</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0F172A;
      color: #F8FAFC;
      padding: 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #38BDF8; }
    .subtitle { font-size: 0.875rem; color: #94A3B8; margin-bottom: 1.5rem; }
    .card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .card h2 { font-size: 1.125rem; margin-bottom: 0.75rem; color: #F8FAFC; }
    input {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #F8FAFC;
      margin-bottom: 0.75rem;
      font-family: monospace;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-align: center;
    }
    input::placeholder { color: #64748B; text-transform: none; letter-spacing: normal; }
    button {
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 0.5rem;
      transition: all 0.15s;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-primary {
      background: #F97316;
      color: #FFF;
    }
    .btn-primary:active:not(:disabled) {
      background: #EA580C;
    }
    .btn-secondary {
      background: #38BDF8;
      color: #0F172A;
    }
    .btn-secondary:active:not(:disabled) {
      background: #0EA5E9;
    }
    .btn-danger {
      background: #DC2626;
      color: #FFF;
    }
    .btn-danger:active:not(:disabled) {
      background: #B91C1C;
    }
    #status {
      font-size: 0.875rem;
      color: #94A3B8;
      padding: 0.75rem;
      background: #0F172A;
      border-radius: 4px;
      margin-bottom: 0.75rem;
      min-height: 3rem;
      display: flex;
      align-items: center;
    }
    #timer {
      font-size: 2rem;
      font-weight: 700;
      color: #F97316;
      text-align: center;
      padding: 1rem;
      font-variant-numeric: tabular-nums;
    }
    progress {
      width: 100%;
      height: 8px;
      -webkit-appearance: none;
      appearance: none;
      border: none;
      border-radius: 4px;
      background: #0F172A;
    }
    progress::-webkit-progress-bar {
      background: #0F172A;
      border-radius: 4px;
    }
    progress::-webkit-progress-value {
      background: #38BDF8;
      border-radius: 4px;
    }
    progress::-moz-progress-bar {
      background: #38BDF8;
      border-radius: 4px;
    }
    .recording-indicator {
      width: 12px;
      height: 12px;
      background: #DC2626;
      border-radius: 50%;
      display: inline-block;
      margin-right: 0.5rem;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .hidden { display: none !important; }
    .success { color: #4ADE80 !important; }
    .error { color: #F87171 !important; }
  </style>
</head>
<body>
  <h1>Clinical Scribe</h1>
  <p class="subtitle">Phone recording</p>

  <div id="pairingCard" class="card">
    <h2>Enter pairing code</h2>
    <input id="pairingCodeInput" type="text" placeholder="6-digit code from desktop" maxlength="6" autocomplete="off">
    <button id="pairButton" class="btn-primary">Connect to desktop</button>
    <p id="pairingStatus"></p>
  </div>

  <div id="recordingCard" class="card hidden">
    <h2>Recording controls</h2>
    <div id="timer">00:00</div>
    <p id="status">Ready to record</p>
    <button id="startRecord" class="btn-primary">Start recording</button>
    <button id="stopRecord" class="btn-danger hidden">Stop recording</button>
    <button id="uploadButton" class="btn-secondary hidden">Upload to desktop</button>
    <button id="discardButton" class="btn-danger hidden">Discard recording</button>
    <progress id="progress" value="0" max="1"></progress>
  </div>

  <script src="/static/phone.js"></script>
</body>
</html>
